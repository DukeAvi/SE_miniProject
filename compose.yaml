x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
  POSTGRES_DB: bbms
  POSTGRES_USER: bbms
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  POSTGRES_SSLROOTCERT: ${POSTGRES_SSLROOTCERT:-}
  CELERY_BROKER_URL: redis://redis:6379/0
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  SECURE_SSL_REDIRECT: "false"
  SECURE_HSTS_SECONDS: "0"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bbms
      POSTGRES_USER: bbms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbms -d bbms"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    command: ["sh", "-c", "mkdir -p \"$$PROMETHEUS_MULTIPROC_DIR\" && rm -f \"$$PROMETHEUS_MULTIPROC_DIR\"/* && python manage.py migrate --noinput && exec gunicorn --config gunicorn.conf.py bbms.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
    environment:
      <<: *app-environment
      PROMETHEUS_METRICS_BEARER_TOKEN: ${BBMS_APP_METRICS_BEARER_TOKEN:?Set BBMS_APP_METRICS_BEARER_TOKEN}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    tmpfs:
      - /tmp/prometheus-multiproc
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "bbms", "worker", "--loglevel=INFO"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A bbms inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 4
    restart: unless-stopped

  beat:
    build: .
    command: ["sh", "-c", "rm -f /tmp/celerybeat.pid && exec celery -A bbms beat --loglevel=INFO --pidfile=/tmp/celerybeat.pid"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  backup-worker:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deployment/backup/Dockerfile
    environment: &backup-environment
      POSTGRES_DB: bbms
      POSTGRES_USER: bbms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT_URL:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-bbms-backups}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:-}
      BACKUP_ALERT_WEBHOOK_BEARER_TOKEN: ${BACKUP_ALERT_WEBHOOK_BEARER_TOKEN:-}
      BACKUP_RESTORE_SPARE_CONFIRMED: ${BACKUP_RESTORE_SPARE_CONFIRMED:-false}
      BACKUP_RESTORE_TARGET_HOST: ${BACKUP_RESTORE_TARGET_HOST:-}
      BACKUP_RESTORE_TARGET_PORT: ${BACKUP_RESTORE_TARGET_PORT:-5432}
      BACKUP_RESTORE_TARGET_DB: ${BACKUP_RESTORE_TARGET_DB:-}
      BACKUP_RESTORE_TARGET_USER: ${BACKUP_RESTORE_TARGET_USER:-}
      BACKUP_RESTORE_TARGET_PASSWORD: ${BACKUP_RESTORE_TARGET_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}
      AWS_CONTAINER_CREDENTIALS_FULL_URI: ${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BACKUP_SCHEDULER_MODE: worker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup-watchdog:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deployment/backup/Dockerfile
    environment:
      <<: *backup-environment
      BACKUP_SCHEDULER_MODE: watchdog
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    volumes:
      - ./deployment/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  monitoring-config-check:
    build: .
    command: ["python", "-m", "scripts.validate_monitoring_config"]
    environment:
      BBMS_PUBLIC_HEALTH_URL: ${BBMS_PUBLIC_HEALTH_URL:-}
      BBMS_ALERT_WEBHOOK_URL: ${BBMS_ALERT_WEBHOOK_URL:-}
      BBMS_APP_METRICS_URL: ${BBMS_APP_METRICS_URL:?Set BBMS_APP_METRICS_URL to the private HTTPS /metrics endpoint}
      BBMS_APP_METRICS_BEARER_TOKEN: ${BBMS_APP_METRICS_BEARER_TOKEN:?Set BBMS_APP_METRICS_BEARER_TOKEN}
      BBMS_PROBE_TARGET_FILE: /app/var/probe-targets/bbms-health.json
      BBMS_METRICS_TARGET_FILE: /app/var/probe-targets/bbms-app-metrics.json
    volumes:
      - probe-targets:/app/var/probe-targets

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=400d"]
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/alerts.yml:/etc/prometheus/alerts.yml:ro
      - probe-targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      blackbox:
        condition: service_started
      alertmanager:
        condition: service_started
      monitoring-config-check:
        condition: service_completed_successfully
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.29.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deployment/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  alert-receiver:
    build: .
    command: ["python", "scripts/alert_receiver.py"]
    environment:
      BBMS_ALERT_WEBHOOK_URL: ${BBMS_ALERT_WEBHOOK_URL:-}
      BBMS_ALERT_WEBHOOK_BEARER_TOKEN: ${BBMS_ALERT_WEBHOOK_BEARER_TOKEN:-}
    depends_on:
      monitoring-config-check:
        condition: service_completed_successfully
    volumes:
      - alert-evidence:/app/var/alerts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9095/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alert-evidence:
  probe-targets:

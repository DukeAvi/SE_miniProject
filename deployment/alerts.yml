groups:
  - name: bbms-availability
    rules:
      - alert: BbmsThreeConsecutiveProbeFailures
        expr: probe_success{job="bbms-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: BBMS readiness probe failed three consecutive times
      - alert: BbmsFiveMinute5xxRateAboveOnePercent
        expr: sum(rate(bbms_http_request_duration_seconds_count{job="bbms-app",status_code=~"5.."}[5m])) / sum(rate(bbms_http_request_duration_seconds_count{job="bbms-app"}[5m])) > 0.01
        labels:
          severity: critical
        annotations:
          summary: BBMS five-minute request 5xx rate exceeded one percent
      - alert: BbmsSearchDashboardP95LatencyAboveThreeSeconds
        expr: histogram_quantile(0.95, sum by (le, route) (rate(bbms_http_request_duration_seconds_bucket{job="bbms-app", route=~"api/v1/inventory/units|api/v1/reports/<str:resource>"}[5m]))) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: BBMS search or dashboard API p95 latency exceeded three seconds for five minutes

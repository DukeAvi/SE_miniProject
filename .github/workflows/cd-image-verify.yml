name: Verify Container Image Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose*.yaml"
      - "gunicorn.conf.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "scripts/**"
      - ".github/workflows/release-image.yml"
      - ".github/workflows/cd-image-verify.yml"

permissions:
  contents: read

jobs:
  verify-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bbms_ci
          POSTGRES_USER: bbms_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbms_ci -d bbms_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.secure.yaml config --quiet

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bbms:pr-verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health endpoint
        run: |
          docker run -d --name bbms-smoke \
            -e DJANGO_SECRET_KEY=ci-smoke-test-secret-key \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SECURE_SSL_REDIRECT=false \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_DB=bbms_ci \
            -e POSTGRES_USER=bbms_ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_SSLMODE=disable \
            --network host bbms:pr-verify
          trap 'docker rm -f bbms-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/healthz

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bbms_ci
          POSTGRES_USER: bbms_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbms_ci -d bbms_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      POSTGRES_DB: bbms_ci
      POSTGRES_USER: bbms_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      BBMS_PUBLIC_HEALTH_URL: https://bbms.example.test/healthz
      BBMS_ALERT_WEBHOOK_URL: https://alerts.example.test/webhook
      BBMS_ALERT_WEBHOOK_BEARER_TOKEN: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest
      - name: Validate deployment Compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.monitoring.yaml config --quiet
      - name: Validate Prometheus and Alertmanager rules
        run: |
          mkdir -p "$RUNNER_TEMP/bbms-monitoring/targets"
          BBMS_PROBE_TARGET_FILE="$RUNNER_TEMP/bbms-monitoring/targets/bbms-health.json" python -m scripts.validate_monitoring_config
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/deployment:/etc/prometheus:ro" -v "$RUNNER_TEMP/bbms-monitoring/targets:/etc/prometheus/targets:ro" prom/prometheus:v3.7.3 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/deployment:/etc/prometheus:ro" prom/prometheus:v3.7.3 check rules /etc/prometheus/alerts.yml
          docker run --rm --workdir=/etc/prometheus --entrypoint=/bin/promtool -v "$PWD/deployment:/etc/prometheus:ro" prom/prometheus:v3.7.3 test rules alerts.test.yml
          docker run --rm --entrypoint=/bin/amtool -v "$PWD/deployment:/etc/alertmanager:ro" prom/alertmanager:v0.29.0 check-config /etc/alertmanager/alertmanager.yml
      - name: Verify Docker restart policy after process exit
        run: |
          container=bbms-restart-policy-check
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker run -d --name "$container" --restart unless-stopped alpine:3.21 sh -c 'if [ ! -f /tmp/first-run ]; then touch /tmp/first-run; exit 1; fi; sleep 30'
          for attempt in $(seq 1 15); do
            running=$(docker inspect --format '{{.State.Running}}' "$container")
            restarts=$(docker inspect --format '{{.RestartCount}}' "$container")
            if [ "$running" = true ] && [ "$restarts" -ge 1 ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
          test "$(docker inspect --format '{{.RestartCount}}' "$container")" -ge 1
          docker rm -f "$container"
      - name: Verify low-stock crossing locks on PostgreSQL
        run: pytest -q tests/integration/inventory/test_low_stock_alerts.py::test_concurrent_stock_reductions_create_one_crossing_alert
        env:
          DJANGO_SETTINGS_MODULE: bbms.settings

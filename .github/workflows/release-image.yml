name: Release Container Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Run Release Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Execute release readiness checks
        run: ./scripts/verify-release-readiness.sh

  build-and-smoke:
    name: Build and Smoke Test Image
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bbms_ci
          POSTGRES_USER: bbms_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbms_ci -d bbms_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare OCI image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image against PostgreSQL
        run: |
          IMAGE_REF="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          docker run -d --name bbms-smoke --network host \
            -e DJANGO_SECRET_KEY=ci-smoke-test-secret-key \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e SECURE_SSL_REDIRECT=false \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_DB=bbms_ci \
            -e POSTGRES_USER=bbms_ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_SSLMODE=disable \
            "$IMAGE_REF"
          trap 'docker rm -f bbms-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/healthz

  publish-image:
    name: Publish Verified Image to GHCR
    needs: [release-gate, build-and-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare OCI image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-summary:
    name: Summarize Published Release Artifact
    needs: publish-image
    runs-on: ubuntu-24.04
    steps:
      - name: Write image delivery summary
        run: |
          echo "### BBMS Release Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** \`ghcr.io/${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ needs.publish-image.outputs.image_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.publish-image.outputs.image_tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
